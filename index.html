<!doctype html>
<html lang="bn">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock Test 01</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="container">
<header><div><h1>WBPSC Miscellaneous Preliminary Exam</h1><p>FULL LENGTH MOCK TEST-01</p></div><div class="timer">⏱ <span id="timer">40:00</span></div></header>
<div class="info"><span>প্রশ্ন: <b id="totalQuestions">50</b></span><span>মোট নম্বর: <b id="totalMarks">50</b></span><span>সঠিক: +1</span><span>ভুল: −0.25</span><span>উত্তর না দিলে: 0</span></div>
<div id="testArea"><div class="progress"><div id="progress"></div></div><section class="card"><div id="questionNo" class="qno"></div><h2 id="questionText"></h2><div id="options"></div><div class="actions"><button id="prev">← Previous</button><button id="next">Next →</button><button id="submit" class="submit">Submit Test</button></div></section></div>
<section id="result" class="result hidden"><h2 id="resultTitle"></h2><div class="score"><span id="score">0.00</span> / 50</div><div class="stats"><div><b id="correct">0</b><small>সঠিক</small></div><div><b id="wrong">0</b><small>ভুল</small></div><div><b id="unanswered">0</b><small>উত্তরহীন</small></div></div><button id="restart" class="submit">আবার পরীক্ষা দিন</button></section>
</div>
<script src="questions.js"></script><script src="config.js"></script><script src="engine.js"></script>
</body></html>
